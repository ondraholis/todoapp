# These values are overridden by Azure App Service environment variables at runtime.
# For local dev, create a local PostgreSQL DB and set the vars below (or use a .env file).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tododb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Passwordless auth via Managed Identity (active when SPRING_DATASOURCE_PASSWORD is not set in Azure)
spring.cloud.azure.credential.managed-identity-enabled=true
spring.datasource.azure.passwordless-enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}

#Azure Blob Storage (static assets + uploads)
# Set these in Azure App Service Configuration Application Settings
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
azure.storage.static-container=${AZURE_STORAGE_STATIC_CONTAINER:static}
azure.storage.uploads-container=${AZURE_STORAGE_UPLOADS_CONTAINER:uploads}

# Static resources
# Base URL for static assets served from Azure Blob Storage.
# When empty the app falls back to serving from /static on the local classpath.
azure.storage.cdn-base-url=${AZURE_STORAGE_CDN_BASE_URL:}
